[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-file-recommendation"
version = "1.0.0"
description = "Local-first agentic file recommendation workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "langgraph>=1.0,<2.0",
    "sqlite-vec>=0.1.6,<0.2",
    "watchfiles>=1.0,<2.0",
    "openpyxl>=3.1,<4.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
]

[project.scripts]
file-recommender = "file_recommender.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "reportlab>=4.0,<5.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "ruff>=0.16,<0.17",
]
semantic = [
    "sentence-transformers>=3.0,<6.0",
]
auth = [
    "PyJWT[crypto]>=2.8,<3.0",
]
documents = [
    "openpyxl>=3.1,<4.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_recommender = ["static/**/*", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]
