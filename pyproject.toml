[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-file-recommendation"
version = "0.1.0"
description = "Local-first intelligent file search and recommendation API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "reportlab>=4.0,<5.0",
    "PyJWT[crypto]>=2.8,<3.0",
]
semantic = [
    "sentence-transformers>=3.0,<6.0",
]
auth = [
    "PyJWT[crypto]>=2.8,<3.0",
]
documents = [
    "openpyxl>=3.1,<4.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]